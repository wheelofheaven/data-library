# Schema 1 — per-chapter cue sheet
#
# Sparse: paragraphs not listed inherit the current scene.
# scene: ""  ends the current run without starting a new one.
# See docs.wheelofheaven.world Audio Play Cue Sheets.
#
# Chapter 1 — "The Encounter". Shot list follows the narrative beats:
#   1–3   the misty Auvergne volcanoes at dawn (default backdrop)
#   4–5   the silent craft descends out of the mist  → elohim-vessel
#   6     the small being comes down the steps        → being-emerges
#   7–19  first words across the crater clearing      → crater-meeting
#   20–40 telepathy, the Bible, the mission           → telepathy-revelation
#   41    entering the flattened-bell craft           → vessel-interior
#   42–62 seated face to face, the long conversation  → vessel-conversation
#   63–64 the craft rises and departs                 → craft-departs

chapter: 1
cues:
  - paragraph: 0
    scene: "intro-hero"
  - paragraph: 1
    scene: "default"
  - paragraph: 4
    scene: "elohim-vessel"
  - paragraph: 6
    scene: "being-emerges"
  - paragraph: 7
    scene: "crater-meeting"
  - paragraph: 20
    scene: "telepathy-revelation"
  - paragraph: 41
    scene: "vessel-interior"
  - paragraph: 42
    scene: "vessel-conversation"
  - paragraph: 63
    scene: "craft-departs"
