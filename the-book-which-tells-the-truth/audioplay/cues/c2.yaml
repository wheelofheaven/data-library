# Chapter 2 — "The Truth". Yahweh reads Genesis and decodes it as the Elohim's
# work. Framed by the encounter (reused), the body is DEPICTED cosmic history:
#   1      the next-day reunion at the craft            → crater-meeting (reuse)
#   2–14   ships study a young primordial Earth         → primordial-earth-orbit
#   15–24  life created in the great laboratory         → creation-laboratory
