# Audio-play manifest for The Book Which Tells the Truth (TBWTT).
# Book-level production config — see docs.wheelofheaven.world
# Audio Play Cue Sheets for the full schema. Phase 3 scope: intro only.

schema: 1
book: the-book-which-tells-the-truth

# Audio Play Intro — a scripted opener that runs BEFORE chapter 1's
# first paragraph. NOT part of the source text. The intro narrator
# (AudioplayNarrator → Jarnathan) sits outside the audio play's
# fictional frame: the in-text Narrator IS Raël writing after the
# fact, while this voice tells the listener what they're about to
# hear. Text is language-keyed; languages without an entry get no
# intro (their render simply starts at paragraph 1).
intro:
  speaker: AudioplayNarrator
  pre_pause_ms: 1000
  post_pause_ms: 2000
  text:
    en: |
      The Book Which Tells the Truth, by Raël. First published in
      French in 1974. This is a Wheel of Heaven audio play.

      In December 1973, the French journalist and racing driver
      Claude Vorilhon — Raël — reports a series of encounters with
      an extraterrestrial being named Yahweh, inside a volcanic
      crater in central France. Over six mornings, Yahweh reads the
      Bible with him line by line, and teaches him that life on
      Earth was created in laboratories by a human civilization
      from another planet: the Elohim.

      You will hear three voices. Raël as the narrator, writing
      after the encounters ended, looking back. Raël inside the
      encounters, asking his questions in real time. And Yahweh,
      teaching — his voice carries a subtle hall reverb to mark his
      off-world origin. The book begins now.
    de: |
      Das Buch, das die Wahrheit sagt, von Raël. Erstmals
      veröffentlicht auf Französisch im Jahr 1974. Dies ist ein
      Wheel-of-Heaven-Hörspiel.

      Im Dezember 1973 berichtet der französische Journalist und
      Rennfahrer Claude Vorilhon — Raël — von einer Reihe von
      Begegnungen mit einem außerirdischen Wesen namens Yahweh, in
      einem Vulkankrater in Zentralfrankreich. An sechs
      aufeinanderfolgenden Morgen liest Yahweh mit ihm Zeile für
      Zeile die Bibel und lehrt ihn, dass das Leben auf der Erde in
      Laboratorien erschaffen wurde — von einer menschlichen
      Zivilisation eines anderen Planeten: den Elohim.

      Sie werden drei Stimmen hören. Raël als Erzähler, der nach
      Abschluss der Begegnungen aus seiner Perspektive als Autor
      zurückblickt. Raël innerhalb der Begegnungen, der seine Fragen
      in Echtzeit stellt. Und Yahweh, der lehrt — seine Stimme trägt
      einen dezenten Hallraum, der seinen außerirdischen Ursprung
      markiert. Das Buch beginnt jetzt.
    fr: |
      Le Livre Qui Dit la Vérité, par Raël. Première publication en
      français en 1974. Ceci est une pièce sonore Wheel of Heaven.

      En décembre 1973, le journaliste et pilote automobile
      français Claude Vorilhon — Raël — rapporte une série de
      rencontres avec un être extraterrestre nommé Yahvé, à
      l'intérieur d'un cratère volcanique du centre de la France.
      Pendant six matins consécutifs, Yahvé lit la Bible avec lui
      ligne par ligne, et lui enseigne que la vie sur Terre a été
      créée en laboratoire par une civilisation humaine venue d'une
      autre planète : les Elohim.

      Vous entendrez trois voix. Raël en tant que narrateur,
      écrivant après la fin des rencontres et regardant en arrière.
      Raël à l'intérieur des rencontres, posant ses questions en
      temps réel. Et Yahvé, qui enseigne — sa voix porte une légère
      réverbération de salle pour marquer son origine
      extraterrestre. Le livre commence maintenant.
