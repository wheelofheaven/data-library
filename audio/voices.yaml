# ElevenLabs voice mapping per (speaker, language).
#
# Fill in voice_id values after picking voices from the ElevenLabs voice library
# at https://elevenlabs.io/app/voice-library. The voice_id is the UUID you see in
# the library URL when you click on a voice.
#
# Voice settings (stability, similarity_boost) are ElevenLabs sliders:
#  - stability (0-1): higher = more consistent voice, lower = more expressive
#  - similarity_boost (0-1): higher = closer to original voice characteristics
#  - style (0-1, eleven_v3+): emotional range; 0 disables
# Recommended defaults below by speaker; adjust after MVP listening.
#
# Cast (decided 2026-06-12):
#  - Phoenix  (aaHNjm7ksE1iw31dNOq5) — "Smooth, Charming and Rich".
#    Narrator + Raël: the in-text Narrator IS Raël as author looking back,
#    so both roles share the voice; prosody differs via per-speaker defaults.
#    Replaces Marcel (I1T6PEfqPxl45yKRN4aS), whose French accent tested
#    poorly with listeners.
#  - Jon      (sB7vwSCyX0tQmU24cW2C) — "Natural Authority". Yahweh.
#  - Jarnathan (c6SfcYrb2t09NHXiT80T) — "Confident and Versatile".
#    AudioplayNarrator: the outside-the-fiction neutral voice that reads
#    intros, book titles, chapter metadata, and descriptions. This is the
#    project-wide neutral Wheel of Heaven voice — reuse it for any future
#    non-book / metadata / announcement audio so the "voice of the site"
#    stays consistent across projects.

# Default model used for all generations
model: eleven_multilingual_v2

# Default per-speaker settings (overridable per-language below)
defaults:
  Narrator:
    stability: 0.75           # raised from 0.55: kill whisper/shout swings
    similarity_boost: 0.75
    style: 0.0
  Raël:
    stability: 0.75           # raised from 0.60: consistent in-scene delivery
    similarity_boost: 0.75
    style: 0.0
  Yahweh:
    stability: 0.70           # consistent gravitas across long monologues
    similarity_boost: 0.80
    style: 0.0
  AudioplayNarrator:
    stability: 0.65           # steady, announcer-like; reads metadata/intros
    similarity_boost: 0.75
    style: 0.0

# Per-language voice assignments. The (speaker, lang) tuple → voice_id.
voices:
  # All languages share the same voices via eleven_multilingual_v2.
  # Phoenix = Narrator + Raël; Jon = Yahweh; Jarnathan = AudioplayNarrator.
  # Same characters across translations.
  # Override per language only if a specific voice mispronounces or sounds wrong.
  en:
    Narrator:          { voice_id: "aaHNjm7ksE1iw31dNOq5" }   # Phoenix
    Raël:              { voice_id: "aaHNjm7ksE1iw31dNOq5" }   # Phoenix (different prosody via defaults)
    Yahweh:            { voice_id: "sB7vwSCyX0tQmU24cW2C" }   # Jon - Natural Authority
    AudioplayNarrator: { voice_id: "c6SfcYrb2t09NHXiT80T" }   # Jarnathan

