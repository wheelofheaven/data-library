# ElevenLabs voice mapping per (speaker, language).
#
# Fill in voice_id values after picking voices from the ElevenLabs voice library
# at https://elevenlabs.io/app/voice-library. The voice_id is the UUID you see in
# the library URL when you click on a voice.
#
# Voice settings (stability, similarity_boost) are ElevenLabs sliders:
#  - stability (0-1): higher = more consistent voice, lower = more expressive
#  - similarity_boost (0-1): higher = closer to original voice characteristics
#  - style (0-1, eleven_v3+): emotional range; 0 disables
# Recommended defaults below by speaker; adjust after MVP listening.

# Default model used for all generations
model: eleven_multilingual_v2

# Default per-speaker settings (overridable per-language below)
defaults:
  Narrator:
    stability: 0.55           # natural narration cadence; some variation
    similarity_boost: 0.75
    style: 0.0
  Raël:
    stability: 0.60           # in-scene dialogue; slightly more grounded
    similarity_boost: 0.75
    style: 0.0
  Yahweh:
    stability: 0.70           # consistent gravitas across long monologues
    similarity_boost: 0.80
    style: 0.0

# Per-language voice assignments. The (speaker, lang) tuple → voice_id.
# Leave voice_id blank until you've picked a voice from the ElevenLabs library.
voices:
  # All languages share the same voices via eleven_multilingual_v2.
  # Marcel = Narrator + Raël; Jon = Yahweh. Same characters across translations.
  # Override per language only if a specific voice mispronounces or sounds wrong.
  en:
    Narrator: { voice_id: "I1T6PEfqPxl45yKRN4aS" }   # Marcel
    Raël:     { voice_id: "I1T6PEfqPxl45yKRN4aS" }   # Marcel (different prosody via defaults)
    Yahweh:   { voice_id: "sB7vwSCyX0tQmU24cW2C" }   # Jon - Natural Authority

  fr:
    Narrator: { voice_id: "I1T6PEfqPxl45yKRN4aS" }
    Raël:     { voice_id: "I1T6PEfqPxl45yKRN4aS" }
    Yahweh:   { voice_id: "sB7vwSCyX0tQmU24cW2C" }

  de:
