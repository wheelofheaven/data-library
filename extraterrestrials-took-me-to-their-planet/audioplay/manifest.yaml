# Audio-play manifest for Extraterrestrials Took Me to Their Planet
# (ETTMTP). Book-level production config — see docs.wheelofheaven.world
# Audio Play Cue Sheets for the full schema. Phase 3 scope: intro only.

schema: 1
book: extraterrestrials-took-me-to-their-planet

intro:
  speaker: AudioplayNarrator
  pre_pause_ms: 1000
  post_pause_ms: 2000
  text:
    en: |
      Extraterrestrials Took Me to Their Planet, by Raël. First
      published in French in 1975. This is a Wheel of Heaven audio
      play, and the sequel to The Book Which Tells the Truth.

      Two years after his first encounters, Raël is contacted
      again — and this time taken aboard. He is flown to the
      planet of the Elohim, shown how their world works, and
      entrusted with the Keys: a guide to living that he is asked
      to carry back to Earth.

      You will hear two voices. Raël as the narrator, telling the
      story in his own words after his return. And Yahweh, his
      guide — whose voice carries a subtle hall reverb to mark his
      off-world origin. The book begins now.
