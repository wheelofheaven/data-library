# Audio-play manifest for Extraterrestrials Took Me to Their Planet
# (ETTMTP). Book-level production config — see docs.wheelofheaven.world
# Audio Play Cue Sheets for the full schema. Phase 3 scope: intro only.

schema: 1
book: extraterrestrials-took-me-to-their-planet

intro:
  speaker: AudioplayNarrator
  pre_pause_ms: 1000
  post_pause_ms: 2000
  text:
    en: |
      Extraterrestrials Took Me to Their Planet, by Raël. First
      published in French in 1975. This is a Wheel of Heaven audio
      play, and the sequel to The Book Which Tells the Truth.

      Two years after his first encounters, Raël is contacted
      again — and this time taken aboard. He is flown to the
      planet of the Elohim, shown how their world works, and
      entrusted with the Keys: a guide to living that he is asked
      to carry back to Earth.

      You will hear two voices. Raël as the narrator, telling the
      story in his own words after his return. And Yahweh, his
      guide — whose voice carries a subtle hall reverb to mark his
      off-world origin. The book begins now.
    de: |
      Außerirdische nahmen mich mit auf ihren Planeten, von Raël.
      Erstmals veröffentlicht auf Französisch im Jahr 1975. Dies ist
      ein Wheel-of-Heaven-Hörspiel und die Fortsetzung von "Das Buch,
      das die Wahrheit sagt".

      Zwei Jahre nach seinen ersten Begegnungen wird Raël erneut
      kontaktiert — und diesmal nimmt man ihn mit an Bord. Er fliegt
      zum Planeten der Elohim. Man zeigt ihm, wie ihre Welt
      funktioniert, und vertraut ihm die Schlüssel an: einen
      Leitfaden zum Leben, den er auf die Erde zurückbringen soll.

      Sie werden zwei Stimmen hören. Raël als Erzähler, der die
      Geschichte nach seiner Rückkehr mit eigenen Worten erzählt.
      Und Yahweh, sein Begleiter — dessen Stimme einen dezenten
      Hallraum trägt, der seinen außerirdischen Ursprung markiert.
      Das Buch beginnt jetzt.
    fr: |
      Les Extra-Terrestres M'ont Emmené sur Leur Planète, par Raël.
      Première publication en français en 1975. Ceci est une pièce
      sonore Wheel of Heaven et la suite du Livre Qui Dit la Vérité.

      Deux ans après ses premières rencontres, Raël est contacté à
      nouveau — et cette fois emmené à bord. Il est conduit vers la
      planète des Elohim. On lui montre comment leur monde fonctionne
      et on lui confie les Clés : un guide de vie qu'on lui demande
      de rapporter sur Terre.

      Vous entendrez deux voix. Raël en tant que narrateur, qui
      raconte l'histoire avec ses propres mots après son retour. Et
      Yahvé, son guide — dont la voix porte une légère réverbération
      de salle pour marquer son origine extraterrestre. Le livre
      commence maintenant.
    es: |
      Los Extraterrestres me llevaron a su planeta, por Raël.
      Publicado por primera vez en francés en 1975. Este es un
      audiodrama de Wheel of Heaven, y la continuación de "El Libro
      que Dice la Verdad".

      Dos años después de sus primeros encuentros, Raël es
      contactado de nuevo — y esta vez llevado a bordo. Es
      transportado al planeta de los Elohim, se le muestra cómo
      funciona su mundo, y se le confían las Llaves: una guía para
      vivir que se le pide que lleve de vuelta a la Tierra.

      Oirá dos voces. Raël como narrador, contando la historia con
      sus propias palabras tras su regreso. Y Yahweh, su guía — cuya
      voz lleva una sutil reverberación de sala para marcar su
      origen extraterrestre. El libro comienza ahora.
    ru: |
      Инопланетяне забрали меня на свою планету, автор — Раэль.
      Впервые опубликована на французском языке в 1975 году. Это
      аудиоспектакль Wheel of Heaven и продолжение книги «Книга,
      которая говорит правду».

      Через два года после первых встреч Раэль вновь получает
      контакт — и на этот раз его берут на борт. Его переносят на
      планету Элохим, показывают, как устроен их мир, и вверяют ему
      Ключи: руководство к жизни, которое он должен принести
      обратно на Землю.

      Вы услышите два голоса. Раэль как рассказчик, повествующий
      историю своими словами после возвращения. И Яхве, его
      проводник — чей голос несёт лёгкую реверберацию зала, чтобы
      обозначить его внеземное происхождение. Книга начинается
      сейчас.
    ja: |
      宇宙人は私を彼らの惑星に連れて行った、ラエル著。1975年にフラン
      ス語で初版発行。Wheel of Heaven のオーディオドラマで、『真実
      を語る本』の続編です。

      最初の遭遇から二年後、ラエルは再び接触され — 今度は乗船を許され
      ます。彼はエロヒムの惑星へと運ばれ、彼らの世界がいかに営まれてい
      るかを見せられ、そして鍵を託されます — 地球へ持ち帰るよう求めら
      れた、生きるための指針です。

      二つの声を聴くことになります。語り手としてのラエル、帰還後に自
      分の言葉で物語を語る。そして案内人のヤハウェ — その声は彼の地
      球外起源を示すために、控えめなホール・リバーブをまとっていま
      す。本はいま、始まります。
    ko: |
      외계인들이 나를 그들의 행성으로 데려갔다, 라엘 저. 1975년에 프
      랑스어로 처음 출간되었습니다. Wheel of Heaven 의 오디오드라마
      이며, 『진실을 말하는 책』의 속편입니다.

      첫 만남으로부터 2년 후, 라엘은 다시 연락을 받으며 — 이번에는 함
      께 비행에 오릅니다. 그는 엘로힘의 행성으로 안내되어 그들의 세계
      가 어떻게 운영되는지를 보게 되고, 열쇠를 부여받습니다 — 지구로
      가져가도록 부탁받은 삶의 지침입니다.

      두 목소리를 듣게 됩니다. 귀환 후 자기 말로 이야기를 들려주는 화
      자로서의 라엘. 그리고 그의 안내자 야훼 — 그의 목소리는 외계의
      기원을 표시하기 위해 은은한 홀 리버브를 담고 있습니다. 책은 이
      제 시작됩니다.
    zh: |
      《外星人带我去他们的星球》，雷尔著。1975年法语首次出版。这是一
      部 Wheel of Heaven 有声剧，是《说真话的书》的续集。

      第一次相遇之后两年，雷尔再次被联系 — 这一次他被接上了飞船。他
      被送往埃洛希姆的星球，被展示了他们的世界如何运作，并被托付了
      《钥匙》：一份请他带回地球的生活指南。

      您将听见两个声音。作为叙述者的雷尔，归来之后以自己的语言讲述这
      段故事。以及他的向导耶和华 — 他的声音带有微妙的厅堂混响，以标
      示其来自异星的来源。本书现在开始。
    zh-Hant: |
      《外星人帶我去他們的星球》，雷爾著。1975年法語首次出版。這是一
      部 Wheel of Heaven 有聲劇，是《說真話的書》的續集。

      第一次相遇之後兩年，雷爾再次被聯繫 — 這一次他被接上了飛船。他
      被送往埃洛希姆的星球，被展示了他們的世界如何運作，並被託付了
      《鑰匙》：一份請他帶回地球的生活指南。

      您將聽見兩個聲音。作為敘述者的雷爾，歸來之後以自己的語言講述這
      段故事。以及他的嚮導耶和華 — 他的聲音帶有微妙的廳堂混響，以標
      示其來自異星的來源。本書現在開始。
    he: |
      החייזרים לקחו אותי לכוכב שלהם, מאת ראל. פורסם לראשונה בצרפתית
      בשנת 1975. זהו מחזה קולי של Wheel of Heaven, והמשכו של הספר
      המספר את האמת.

      שנתיים לאחר מפגשיו הראשונים, שבים ויוצרים עם ראל קשר — והפעם
      הוא נלקח על סיפון הכלי. הוא מוטס אל כוכבם של האלוהים, לומד כיצד
      פועל עולמם, ומופקדים בידיו המפתחות: מדריך לחיים שהוא מתבקש לשאת
      עמו בחזרה אל כדור הארץ.

      תשמעו שני קולות. ראל כמספר, המגולל את הסיפור במילותיו שלו לאחר
      שובו. ויהוה, מדריכו — קולו נושא הד אולם עדין המסמן את מוצאו
      החוצני. הספר מתחיל כעת.
