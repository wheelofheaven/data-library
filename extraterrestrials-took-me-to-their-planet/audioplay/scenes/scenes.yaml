      figure — Raël in 1970s clothes, seen from behind (match the
      rael-claude-vorilhon portrait) — stands before a vast silver Elohim
      mother-ship hovering silently above, its soft cool underglow lighting the
      field; a sense of being summoned to the stars. Epic scale and cosmic
      threshold, moody and reverent, muted earthy palette with a single cool
      accent, 35mm grain. Generous empty sky / negative space for a title, clean
      lower third. NOT golden, NOT sunset.
