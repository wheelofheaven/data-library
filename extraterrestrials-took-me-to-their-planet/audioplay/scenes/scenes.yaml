# Scene image manifest — Extraterrestrials Took Me To Their Planet
#
# IMAGE-GENERATION handoff. Each entry maps to a `scene` id in
# audioplay/cues/c*.yaml. Language-neutral (no text), one image per scene,
# reused across all languages. Output: <id>.jpg here, synced to
# assets.wheelofheaven.world/images/cinematic/extraterrestrials-took-me-to-their-planet/<id>.jpg
#
# SAME visual identity + style anchors as book 1 (default.jpg + elohim-vessel.jpg)
# so the two films feel continuous. ~2-min beats, mapped to the source.

book: extraterrestrials-took-me-to-their-planet

style:
  id: tbwtt
  prefix: >-
    Cinematic widescreen still, 1970s grounded science-fiction realism,
    naturalistic film lighting, 35mm grain, muted earthy palette with a single
    cool light accent, restrained and reverent mood, no text, no captions,
    no watermark, no people facing camera unless specified.
  suffix: >-
    Painterly-photographic, shallow depth of field, composed for a 16:9 frame
    with generous negative space in the lower third for subtitle overlay.
  negative: >-
    text, lettering, watermark, logo, signature, lens flare overload, cartoon,
    anime, oversaturation, deformed anatomy, explicit nudity
  aspect: "16:9"
  gen_size: "2560x1440"
  model: "gpt-image-1"
  seed: null

# --- Character bible ----------------------------------------------------------
# Match the established wiki portraits — feed them as character references.
# NOTE: this is the SECOND encounter / the planet, so Yahweh NO LONGER wears the
# green suit + halo of book 1 — here it is the white "eternal" attire (exactly
# the yahweh-eloha portrait).
characters:
  yahweh:
    portrait_ref: images/wiki/yahweh-eloha
    description: >-
      Match the yahweh-eloha portrait exactly: serene, long dark centre-parted
      hair past the shoulders, neat dark beard and moustache, almond eyes, in a
      fitted WHITE high-collared one-piece suit (his eternal/planet attire — no
      green suit, no halo here).
  rael:
    portrait_ref: images/wiki/rael-claude-vorilhon
    description: >-
      Match the rael-claude-vorilhon portrait: late twenties, dark wavy hair,
      1970s gold-tinted aviator glasses, clean-shaven. On Earth he wears 1970s
      clothes; aboard the planet he wears a close-fitting white silk garment.
  elohim:
    portrait_ref: images/wiki/elohim-collective
    description: >-
      The Elohim (the creators / the eternals) — a serene advanced human-like
      people of varied appearance in fitted white one-piece suits. Among the
      eternals on the planet are the resurrected prophets (a calm bearded Jesus,
      Moses, Elijah, Muhammad, Buddha). Shown at a respectful distance, not in
      facial close-up.

scenes:
  - id: default
    title: "Establishing backdrop"
    prompt: >-
      A calm night sky over a quiet rural French landscape, soft
      starlight, an expectant stillness.
    status: pending
    seed: null

